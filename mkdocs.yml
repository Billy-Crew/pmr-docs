site_name: PMR Developer Documentation
site_description: Kuanta PMR — Programmable Message Router 개발자 문서
site_url: https://billy-crew.github.io/pmr-docs/

theme:
  name: material
  language: ko
  custom_dir: overrides
  logo: assets/logo.svg
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: custom/moon
        name: 다크 모드로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: custom/sun
        name: 라이트 모드로
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/css/SpoqaHanSansNeo.css
  - stylesheets/extra.css

nav:
  - 시작하기:
      - PMR이란 무엇인가: index.md
      - 핵심 용어: 02_핵심-용어.md
      - 아키텍처 개요: 03_아키텍처-개요.md
      - 퀵 스타트 첫 레이아웃: 04_퀵스타트-첫-레이아웃.md
  - 핵심 개념:
      - VNT 런타임 엔진: 05_VNT-런타임-엔진.md
      - 레이아웃과 토픽: 06_레이아웃과-토픽.md
      - 액션 파이프라인: 07_액션-파이프라인.md
      - 룰 (Rules): 08_룰-Rules.md
      - Bolt-Log와 리플레이: 09_Bolt-Log와-리플레이.md
  - 프로그래밍 가이드:
      - Moonscript 기초: 10_Moonscript-기초.md
      - C 데이터 타입 다루기: 11_C-데이터-타입-다루기.md
      - 전문 정의와 식별자: 12_전문-정의와-식별자.md
      - 가공·분배 함수: 13_가공-분배-함수.md
  - 액션 레퍼런스:
      - 액션 목록: 14_액션-목록.md
      - PROUTE 상세: 15_PROUTE-상세.md
  - 운영:
      - 무중단 배포 (Hot-Reload): 16_무중단-배포-Hot-Reload.md
      - PMR Control 관제: 17_PMR-Control-관제.md
      - Watch List 모니터링: 18_Watch-List-모니터링.md
      - 메시지 검색과 리플레이: 19_메시지-검색과-리플레이.md
  - 적용 사례 & 패턴:
      - 통합시세 시스템 구성: 20_통합시세-시스템-구성.md
      - 2nd 레이어 격리 패턴: 21_2nd-레이어-격리-패턴.md
      - 정보원 이중화: 22_정보원-이중화.md
      - 확장 시나리오와 공수: 23_확장-시나리오와-공수.md
  - 부록:
      - PMR vs 범용 메시지 브로커: 24_PMR-vs-범용-메시지-브로커.md
      - FAQ: 25_FAQ.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true
